<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보마케팅 도우미</title>
<style>
  :root{ --bg:#eef3f8; --card:#fff; --ink:#16202e; --sub:#586579; --line:#d6dde9; --accent:#2563eb; --soft:#e8f0ff; --good:#15803d; --warn:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{background:#0f2a4a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:17px}
  header .sp{flex:1}
  header .st{font-size:12.5px;color:#b7c9e6}
  header button,header label.btn{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid #2d4f7c;background:#173a64;color:#fff;cursor:pointer;font-weight:600}
  .steps{display:flex;gap:8px;max-width:980px;margin:14px auto 0;padding:0 16px}
  .steps button{flex:1;font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer}
  .steps button b{display:block;font-size:14px}
  .steps button small{color:var(--sub);font-size:12px}
  .steps button.on{border-color:var(--accent);background:var(--soft)}
  .steps button.done b::after{content:" ✓";color:var(--good)}
  .wrap{max-width:980px;margin:0 auto;padding:12px 16px 90px}
  .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin:10px 0}
  .prog .bar{flex:1;height:8px;background:#dbe5f2;border-radius:99px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0;transition:width .3s}
  .intro{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#9a3412;margin-bottom:12px}
  .intro button{font:inherit;font-size:12.5px;font-weight:700;margin-left:6px;padding:3px 10px;border-radius:8px;border:1px solid #fdba74;background:#fff;cursor:pointer;color:#9a3412}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 12px #2563eb10}
  .card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}
  .card h2 .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .card.done h2 .n{background:var(--good)}
  .tip{font-size:13px;color:var(--sub);margin:0 0 12px 40px}
  .q{margin-bottom:11px}
  .q>label{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
  .q>label small{font-weight:500;color:var(--sub)}
  input[type=text],input[type=number],textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#f8fafc;color:var(--ink);font-size:14.5px}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #2563eb55;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .chips span{font-size:11.5px;font-weight:800;color:#7c3aed;align-self:center}
  .chips button{font:inherit;font-size:12px;border:1px dashed #a78bfa;background:#f5f3ff;color:#5b21b6;padding:2px 10px;border-radius:99px;cursor:pointer}
  .chips button:hover{background:#ede9fe}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fn{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fbfcff;margin-bottom:8px}
  .fn b{font-size:12.5px;color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags label{font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;background:#fff;user-select:none}
  .tags input{display:none}
  .tags label.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .out{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:14px;padding:10px 12px;margin-top:6px}
  .out .oh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#4338ca;margin-bottom:4px}
  .out .oh span{margin-left:auto;font-weight:600;color:var(--sub)}
  .out .oh button{font:inherit;font-size:12px;padding:2px 10px;border-radius:8px;border:1px solid #a5b4fc;background:#fff;cursor:pointer;font-weight:700;color:#4338ca}
  .out textarea{background:#fff;min-height:96px}
  .out .oh .hb2{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0}
  .helper{margin-top:8px;background:#fff;border:1.5px solid #c7d2fe;border-radius:14px;padding:10px 12px}
  .helper .hh{font-weight:800;font-size:13.5px;color:#4338ca;margin-bottom:6px}
  .helper .hc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .helper .hc span{background:#eef2ff;border-radius:99px;padding:2px 11px;font-size:12px}
  .helper .hc b{color:#4338ca;margin-right:4px}
  .helper .hb{font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:8px;padding:5px 10px;margin-bottom:6px}
  .helper .hd{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:3px}
  .helper .hd button,.helper .vr button{font:inherit;font-size:12px;font-weight:700;padding:3px 12px;border-radius:8px;border:1px solid #a5b4fc;background:#eef2ff;color:#4338ca;cursor:pointer;margin-left:auto}
  .helper .hd .ok{margin-left:auto;font-size:12px;color:var(--good);font-weight:700}
  .helper pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;background:#f8fafc;border-radius:10px;padding:8px 10px}
  .helper .vr{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .helper .vr button{margin-left:0}
  .helper .vt{font-size:12px;color:var(--sub);margin-top:4px}
  .helper .hk{font-size:12.5px;background:#fff7ed;border-radius:10px;padding:6px 10px;margin-top:8px;color:#9a3412}
  .helper .hk.good{background:#f0fdf4;color:#166534}
  .hintline{font-size:12.5px;margin-top:4px;color:var(--warn)}
  .hintline.ok{color:var(--good)}
  .calc{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;margin:6px 0 10px}
  .calc .big{font-size:18px;font-weight:900;color:#0f766e}
  .doc{background:#fff;border:1px solid #cbd5e1;box-shadow:0 4px 16px #0002;padding:22px 26px;margin:8px 0 16px;font-size:13px}
  .doc h3{text-align:center;font-size:20px;margin:0 0 10px;letter-spacing:.2em}
  .doc table{border-collapse:collapse;width:100%}
  .doc td,.doc th{border:1px solid #444;padding:6px 8px;vertical-align:top;text-align:left}
  .doc th{background:#e9ecef;font-size:13px}
  .doc td.a{min-height:70px;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
  .doc td.empty{color:#aaa}
  .final{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .final button{font:inherit;font-weight:800;padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .final .go{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0;font-size:16px;box-shadow:0 6px 18px #4f46e544}
  .chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin:8px 0}
  .chk div{font-size:13px;padding:5px 10px;border-radius:10px;background:#f1f5f9}
  .chk div.ok{background:#dcfce7;color:#166534} .chk div.no{background:#fee2e2;color:#991b1b}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;gap:10px;z-index:5}
  nav .in{max-width:980px;width:100%;display:flex;gap:10px;align-items:center}
  nav button{font:inherit;font-weight:800;padding:10px 26px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
  nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  nav button:disabled{opacity:.35;cursor:default}
  nav .mid{flex:1;text-align:center;font-size:13px;color:var(--sub)}
  .qlist{display:flex;flex-direction:column;gap:5px}
  .qlist label{display:block;font-size:13.5px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;background:#fff;user-select:none}
  .qlist input{margin-right:8px}
  .qlist label.on{background:var(--soft);border-color:var(--accent);color:#1e3a8a;font-weight:700}
  .logstat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
  table.lg{border-collapse:collapse;width:100%;font-size:13px}
  table.lg th{background:#e9ecef;border:1px solid #cbd5e1;padding:5px 6px;font-size:12.5px;text-align:left}
  table.lg td{border:1px solid #cbd5e1;padding:3px}
  table.lg td:first-child{text-align:center;width:30px;color:var(--sub)}
  table.lg input,table.lg select{width:100%;font:inherit;font-size:13px;padding:5px 6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}  .avbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
  .avbox canvas{width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px #0003;flex:none}
  .avopt{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px;font-size:13px}
  .avopt b{display:inline-block;width:68px;color:var(--sub)}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8;cursor:pointer;margin-right:4px;vertical-align:middle}
  .sw.on{box-shadow:0 0 0 3px var(--accent)}
  .ob{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:2px 11px;cursor:pointer;margin-right:4px}
  .ob.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .mini{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #a5b4fc;background:#fff;color:#4338ca;border-radius:8px;padding:3px 11px;cursor:pointer}  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
  .cs{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative}
  .cs .ci{font-size:20px}.cs b{font-size:13.5px}.cs small{color:var(--sub);font-size:11.5px;line-height:1.3}
  .cs:hover{border-color:#94a3b8}
  .cs.on{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .cs.on::after{content:"✓";position:absolute;right:8px;top:6px;color:var(--accent);font-weight:900}
  .selrows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .selrow{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:5px 8px}
  .selrow b{font-size:13px}.selrow input{padding:6px 9px;font-size:13.5px}
  .selrow .x{font:inherit;border:0;background:#fee2e2;color:#991b1b;border-radius:8px;cursor:pointer;padding:3px 0}
  .cadd{display:flex;gap:8px;margin-bottom:6px}.cadd input{flex:1;padding:7px 10px;font-size:13.5px}
  .mini{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #a5b4fc;background:#fff;color:#4338ca;border-radius:8px;padding:3px 11px;cursor:pointer}
  details.minicv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:14px}
  details.minicv summary{cursor:pointer;font-weight:800;font-size:14px;margin-bottom:6px}
  table.lg{border-collapse:collapse;width:100%;font-size:13px}
  table.lg th{background:#e9ecef;border:1px solid #cbd5e1;padding:5px 6px;font-size:12.5px;text-align:left}
  table.lg td{border:1px solid #cbd5e1;padding:4px 6px}
  table.lg select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
  @media (max-width:760px){ .selrow{grid-template-columns:1fr 34px}.selrow b{grid-column:1/3} }  .rb{display:inline-block;font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer;background:#fff;margin-right:4px;user-select:none}
  .rb input{display:none}.rb.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .recrow{margin-top:8px;padding:8px 10px;background:#fff;border:1px solid #99f6e4;border-radius:10px;font-size:13.5px}
  .recrow.hi{border-color:#f59e0b;background:#fffbeb}.recrow .pri{font-size:11.5px;font-weight:800;background:#e2e8f0;border-radius:99px;padding:1px 9px;margin-left:4px}
  .recrow.hi .pri{background:#fde68a;color:#92400e}
  .warn{margin-top:8px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700}
  .disc{margin-top:8px;font-size:12.5px;color:#7c2d12;background:#fff;border:1px dashed #fdba74;border-radius:10px;padding:6px 10px}
  .logstat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px}  .typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
  .tcard{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .tcard canvas{width:100%;height:auto;border-radius:10px;border:1px solid #e2e8f0;background:#fff}
  .tcard b{font-size:14px;margin-top:3px}.tcard small{color:var(--sub);font-size:12px;line-height:1.35}
  .tcard:hover{border-color:#94a3b8}.tcard.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent) inset}
  .canvascard{padding:10px 12px}.canvascard .oh2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:13.5px}
  .canvascard.stick{position:sticky;top:52px;z-index:4;box-shadow:0 6px 18px #0003}
  #cardCanvas{display:block;width:100%;max-height:46vh;aspect-ratio:16/9;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:grab;background:#fff;object-fit:contain}
  .canvascard:not(.stick) #cardCanvas{max-height:none}
  .wrap.wide{max-width:1560px}
  .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
  .split .left{position:sticky;top:56px;z-index:3}
  .split .left .canvascard{margin-bottom:0}
  .split .left #cardCanvas{max-height:calc(100vh - 190px)}
  .split .right{min-width:0}
  table.lg .sw{width:20px;height:20px;margin-right:2px}
  @media (max-width:1000px){ .split{grid-template-columns:1fr} .split .left{top:50px} .split .left #cardCanvas{max-height:34vh} .split .left .calc{display:none} }
  @media print{ .canvascard .oh2{display:none} #cardCanvas{max-height:none} }  .catbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .catbar button{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 13px;cursor:pointer}
  .catbar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
  .cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .cwrap{position:relative;font:inherit;border:0;background:none;padding:0;cursor:pointer;border-radius:14px;transition:transform .12s}
  .cwrap:hover{transform:translateY(-3px)}
  .cwrap canvas{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 2px 8px #0002}
  .cwrap.picked canvas{box-shadow:0 0 0 4px #dc2626,0 4px 14px #dc262655}
  .cwrap.rec:not(.picked) canvas{box-shadow:0 0 0 3px #f59e0b}
  .recb,.newb{position:absolute;left:10px;bottom:10px;z-index:2;font-size:11px;font-weight:800;border-radius:99px;padding:1px 9px;color:#fff;background:#f59e0b}
  .newb{background:#7c3aed}.recb+.newb{left:56px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .slot{border:2px dashed #cbd5e1;border-radius:12px;padding:8px 10px;background:#fff;font-size:13px}
  .slot.on{border:2px solid #dc2626;background:#fef2f2}
  .slot .sn{font-weight:800;margin:3px 0 6px;font-size:14px}
  .rv{display:grid;grid-template-columns:90px 200px 1fr 190px;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;align-items:start}

  .rv .rl{font-weight:800;font-size:15px;padding-top:6px}
  .rv .rcard canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 2px 8px #0002}
  .calcrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .calcrow label{display:flex;flex-direction:column;font-size:12px;font-weight:700;flex:1;min-width:100px}
  .calcrow label input{padding:6px 8px;font-size:14px}.calcrow label small{font-weight:500;color:var(--sub)}
  .calcrow span{font-weight:900;padding-bottom:22px;color:#64748b}
  .coach{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:6px 10px;font-size:12.5px;margin-top:6px;color:#78350f}
  .rsales{border:2px solid #1d4ed8;border-radius:12px;padding:8px;text-align:center;font-size:13px}
  .rsales label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}.rsales input{padding:5px 8px;text-align:center}
  .rsales .big{font-size:26px;font-weight:900;color:#0f172a;margin-top:4px}.rsales .big small{font-size:13px}
  .sbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:6px;background:#e2e8f0}

  .mback{position:absolute;inset:0;background:rgba(15,23,42,.6)}

  .mx{position:absolute;right:12px;top:10px;font:inherit;border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
  .mcol canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 4px 16px #0003}
  .mnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
  .mtxt h3{margin:0 0 6px;font-size:21px}.mtxt p{margin:0 0 8px;font-size:14.5px}
  .mrow{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
  .mrow.coach{background:#fffbeb;border-color:#fde68a}
  .mact{margin-top:10px}.go2{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:10px 20px;background:linear-gradient(90deg,#dc2626,#ea580c);color:#fff;cursor:pointer}

function batchim(w){ w = String(w || "").trim().replace(/[)\]」』”’"'.!?\s]+$/, ""); const ch = w.slice(-1); if(!ch) return false; if(/[0-9]/.test(ch)) return "013678".includes(ch); const c = ch.charCodeAt(0); if(c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0; return /[lmnLMN]/.test(ch) && false; }

async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv", "readwrite").objectStore("kv").put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); }

    try {

        body: JSON.stringify({model: "claude-haiku-4-5-20251001", max_tokens: 900, system: `너는 ${CFG.role}다. 학생이 정리한 ${CFG.name} 내용을 보고, 반드시 핵심만 아래 형식 그대로 한국어로 출력한다. 각 항목은 한 줄(60자 내외), 다른 말은 쓰지 않는다.\n${tpl()}`, messages: [{role: "user", content: p}]})});
      const j = await r.json(); if(!r.ok) throw new Error((j.error && j.error.message) || r.status);
      setTa("aiAnswer", j.content.map(c => c.text || "").join("").trim());
    } catch(e){ alert("AI 호출 실패: " + e.message + "\n키가 맞는지 확인하거나 ‘프롬프트 복사’를 이용해 주세요."); }
    const b2 = $q('[data-aih="ask"]'); if(b2){ b2.disabled = false; b2.textContent = "🤖 AI에게 질문하고 핵심 정리"; }
  }
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-aih]"); if(!b) return; const op = b.dataset.aih; ensureAi();
    if(op === "prompt"){ if(cl(d.aiPrompt) && !confirm("지금 쓴 프롬프트를 초안으로 바꿀까요?")) return; setTa("aiPrompt", makePrompt()); }
    else if(op === "tpl"){ if(cl(d.aiAnswer) && !confirm("지금 쓴 내용을 정리 틀로 바꿀까요?")) return; setTa("aiAnswer", tpl()); }
    else if(op === "copy"){ if(!cl(d.aiPrompt)){ alert("먼저 프롬프트 초안을 만들어 주세요."); return; }
      const bad = () => alert("복사하지 못했어요. 칸의 글을 직접 선택해 복사해 주세요.");
      if(navigator.clipboard) navigator.clipboard.writeText(d.aiPrompt).then(() => say("✔ 복사됨"), bad); else bad(); }
    else if(op === "key"){ const k = prompt("AI 연결용 Anthropic API 키를 입력하세요.\n(이 컴퓨터 브라우저에만 저장되고, 저장 파일에는 들어가지 않아요. 지우려면 빈칸으로 확인)", aiKey()); if(k === null) return; try { k.trim() ? localStorage.setItem(AKEY, k.trim()) : localStorage.removeItem(AKEY); } catch(e){} }
    else if(op === "ask") ask();
  });
  document.addEventListener("toggle", e => { if(e.target && e.target.id === "aihcard") window.__aihOpen = e.target.open; }, true);
  document.addEventListener("input", e => { const t = e.target, k = t.dataset && t.dataset.aihK; if(!k) return; ensureAi(); d[k] = t.value; try { persist(); } catch(er){} });
  // 문서(PPT·Word·미리보기)에 넣는 앱 : 카드 선택형 엔진은 doc()에 글 블록을 더한다
  if(CFG.doc && typeof GW !== "undefined" && typeof GW.doc === "function"){
    const _doc = GW.doc; GW.doc = function(){ const r = _doc.apply(this, arguments); if(cl(d.aiPrompt) || cl(d.aiAnswer)) r.texts = [...(r.texts || []), {title: "AI에게 질문한 프롬프트", text: d.aiPrompt}, {title: "AI 답변 핵심 내용", text: d.aiAnswer}]; return r; };
  }
  try { ensureAi(); render(); } catch(e){}
})();
</script>
